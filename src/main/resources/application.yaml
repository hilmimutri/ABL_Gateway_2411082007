server:
  port: 9001

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUK
              uri: lb://PRODUK
              predicates:
                - Path=/api/produk/**
            - id: ORDER
              uri: lb://ORDER
              predicates:
                - Path=/api/order/**
            - id: PELANGGAN
              uri: lb://PELANGGAN
              predicates:
                - Path=/api/pelanggan/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
